worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================
    #  解決「Docker 內 nginx upstream DNS 快取問題」
    # ---------------------------------------------------------
    #  問題：upstream {} 區塊 / 直接寫死的 proxy_pass 名稱，
    #        只會在「nginx 啟動時做一次 DNS 解析」並永久快取 IP。
    #        當 trigger-app / admin-app 容器重啟、IP 改變後，
    #        nginx 仍指向舊 IP → 502/504，必須手動重啟 nginx 才會好。
    #
    #  解法（開源版 nginx 標準作法，兩者缺一不可）：
    #    1. resolver 指向 Docker 內建 DNS 127.0.0.11，並用 valid 設定
    #       重新解析的週期（這裡 10 秒）。
    #    2. proxy_pass 後端位址改用「變數」。nginx 只有在 proxy_pass
    #       含變數時，才會在「每次請求時」依 resolver 重新解析 DNS。
    #
    #  附帶好處：後端容器暫時掛掉時 nginx 仍可正常啟動，待後端恢復後
    #            會自動重新解析、自動恢復，不需手動 reload。
    # =========================================================
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 後端服務位址（Docker service 名稱:埠）改用「變數」帶入 proxy_pass，
    # 以啟用上面的「每次請求時依 resolver 重新解析 DNS」。
    # 變數在各 server 區塊內用 set 定義（見下）。
    # 注意：proxy_pass 用變數時請維持「不帶 URI」的形式，
    #       行為才會與原本的 upstream 寫法一致（原始 request URI 原封轉發）。

    # 增加 Timeout 時間 (解決 AI 生成過久導致 504)
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # =========================================================
    #  環境 A: 正式環境 - Admin (Cloudflare Zero Trust 保護)
    #  網址: https://sedashboard.20231202.xyz
    # =========================================================
    server {
        listen 80;
        server_name sedashboard.20231202.xyz sedashboard.test.xyz; # 正式環境網域 + 本地測試網域

        set $admin_backend "admin-app:8080";

        # 管理後台 API (SSE 串流專用)
        location /api/trigger_page/generate_with_ai_stream {
            proxy_pass http://$admin_backend;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # 管理後台 API
        location /api/ {
            proxy_pass http://$admin_backend;
            include proxy_params_common;
        }

        # 管理後台前端
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # =========================================================
    #  環境 B: 正式環境 - Trigger (公開給受測者)
    #  網址: https://selink.20231202.xyz
    # =========================================================
    server {
        listen 80;
        server_name selink.20231202.xyz selink.test.xyz selinks.sec-corp.cc; # 正式環境網域 + 本地測試網域 + 別名

        set $trigger_backend "trigger-app:8080";

        # 直接導向 Trigger App，不需要 /trigger 前綴，更真實
        location / {
            proxy_pass http://$trigger_backend;
            include proxy_params_common;
        }
    }

    # =========================================================
    #  環境 C: 本地開發環境 (Localhost)
    #  網址: http://localhost
    # =========================================================
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        set $trigger_backend "trigger-app:8080";
        set $admin_backend "admin-app:8080";

        # 為了在本地能同時測兩個系統，我們必須用「路徑」來區分
        # 這就是你原本的寫法

        # 1. 本地測試 Trigger: http://localhost/trigger/
        location /trigger/ {
            proxy_pass http://$trigger_backend;
            # 注意: 這裡 proxy_pass 不帶 URI，會保留原始路徑結構 (/trigger/...)，
            #       與原本 upstream 寫法行為一致。視你的 App 需求調整。

            include proxy_params_common;
        }

        # 2. 本地測試 Admin API: http://localhost/api/
        location /api/trigger_page/generate_with_ai_stream {
            proxy_pass http://$admin_backend;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            proxy_pass http://$admin_backend;
            include proxy_params_common;
        }

        # 3. 本地測試 Admin 前端: http://localhost/
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # =========================================================
    #  環境 D: 動態多 Domain Catch-all (給 Trigger App 的白標 domain)
    #  任何沒匹配到上面 server_name 的 hostname 都走這裡 → trigger-app
    #  搭配 trigger-app 端 Host header 軟隔離，避免跨客戶存取
    # =========================================================
    server {
        listen 80 default_server;   # catch-all：任何未匹配 server_name 的請求都走這裡
        server_name _;

        set $trigger_backend "trigger-app:8080";

        location / {
            proxy_pass http://$trigger_backend;
            include proxy_params_common;
        }
    }
}
