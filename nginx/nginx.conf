worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- 1. 定義共用的後端 Upstream ---
    # 這樣無論是本地還是正式環境，都指向相同的 Docker Container
    upstream trigger_app_backend {
        server trigger-app:8080;
    }

    upstream admin_api_backend {
        server admin-app:8080;
    }

    # 增加 Timeout 時間 (解決 AI 生成過久導致 504)
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # =========================================================
    #  環境 A: 正式環境 - Admin (Cloudflare Zero Trust 保護)
    #  網址: https://sedashboard.20231202.xyz
    # =========================================================
    server {
        listen 80;
        server_name sedashboard.20231202.xyz sedashboard.test.xyz; # 正式環境網域 + 本地測試網域

        # 管理後台 API (SSE 串流專用)
        location /api/trigger_page/generate_with_ai_stream {
            proxy_pass http://admin_api_backend;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # 管理後台 API
        location /api/ {
            proxy_pass http://admin_api_backend;
            include proxy_params_common; 
        }

        # 管理後台前端
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # =========================================================
    #  環境 B: 正式環境 - Trigger (公開給受測者)
    #  網址: https://selink.20231202.xyz
    # =========================================================
    server {
        listen 80;
        server_name selink.20231202.xyz selink.test.xyz; # 正式環境網域 + 本地測試網域

        # 直接導向 Trigger App，不需要 /trigger 前綴，更真實
        location / {
            proxy_pass http://trigger_app_backend;
            include proxy_params_common;
        }
    }

    # =========================================================
    #  環境 C: 本地開發環境 (Localhost)
    #  網址: http://localhost
    # =========================================================
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # 為了在本地能同時測兩個系統，我們必須用「路徑」來區分
        # 這就是你原本的寫法

        # 1. 本地測試 Trigger: http://localhost/trigger/
        location /trigger/ {
            proxy_pass http://trigger_app_backend; 
            # 注意: 這裡沒加斜線，會保留路徑結構，視你的App需求調整
            # 如果你的 App 預期收到的是根路徑 /，則要寫成 proxy_pass http://trigger_app_backend/;
            
            include proxy_params_common;
        }

        # 2. 本地測試 Admin API: http://localhost/api/
        location /api/trigger_page/generate_with_ai_stream {
            proxy_pass http://admin_api_backend;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            proxy_pass http://admin_api_backend;
            include proxy_params_common;
        }

        # 3. 本地測試 Admin 前端: http://localhost/
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # =========================================================
    #  環境 D: 動態多 Domain Catch-all (給 Trigger App 的白標 domain)
    #  任何沒匹配到上面 server_name 的 hostname 都走這裡 → trigger-app
    #  搭配 trigger-app 端 Host header 軟隔離，避免跨客戶存取
    # =========================================================
    server {
        listen 80 default_server;   # catch-all：任何未匹配 server_name 的請求都走這裡
        server_name _;

        location / {
            proxy_pass http://trigger_app_backend;
            include proxy_params_common;
        }
    }
}