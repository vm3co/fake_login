worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 引入標準的 MIME 類型定義，確保 .js, .css 等檔案被正確識別
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 定義 trigger-app 網頁服務的位置
    upstream trigger_app_backend {
        server trigger-app:8080;
    }

    # 定義 admin-app 網頁服務的位置
    upstream admin_api_backend {
        server admin-app:8080;
    }

    # 單一 Server Block 處理所有請求
    server {
        listen 80;
        server_name localhost; # 您唯一使用的網域名稱 (本地測試可用 localhost)

        # -----------------
        # 規則一: trigger-app
        # -----------------
        # 當使用者訪問 /trigger/... 時，將請求轉發給 trigger-app
        location /trigger/ {
            # proxy_pass 後面的斜線 "/" 很重要！
            # 它會告訴 Nginx 將 /trigger/ 這段路徑從請求中移除再轉發。
            # 例如：/trigger/dashboard -> /dashboard
            proxy_pass http://trigger_app_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------
        # 規則二: admin-app
        # -----------------
        # 當使用者訪問 /admin/api/... 時，將請求轉發給 admin-app 的後端 API
        location /api/ {
            proxy_pass http://admin_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 當使用者訪問 /admin/... 時，提供 admin-app 的前端靜態檔案
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # # 可選：根目錄的歡迎頁面或重導向
        # location = / {
        #     return 301 /; # 例如，直接訪問根目錄就跳轉到 /trigger/
        # }
    }
}