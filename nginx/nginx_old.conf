# admin 跟 trigger 是不同的網址

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 引入標準的 MIME 類型定義，確保 .js, .css 等檔案被正確識別
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 定義 admin-app 後端 API 的位置
    upstream admin_api_backend {
        server admin-app:8080;
    }

    # 定義 trigger-app 網頁服務的位置
    upstream trigger_app_backend {
        server trigger-app:8080;
    }

    server {
        listen 80;
        server_name se.dashboard.com; # adminapp

        # Nginx 將從這個目錄提供前端靜態文件
        root /usr/share/nginx/html;
        index index.html;

        # 將所有 API 請求代理到後端服務
        location /api {
            proxy_pass http://admin_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 處理 React Router 的路由，確保刷新頁面時不會 404
        location / {
            try_files $uri /index.html;
        }
    }

    server {
        listen 80;
        server_name se.fakelogin.com; # trigger

        # 將所有請求直接代理到 trigger-app 服務
        location / {
            proxy_pass http://trigger_app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
